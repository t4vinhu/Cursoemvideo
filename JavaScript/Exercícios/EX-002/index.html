<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
    <style>
        body{
            background-color: rgb(85, 249, 194);
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.568);
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1em;
        }
        
    </style>
</head>
<body>
    <h1>Olá, mundo!</h1>
    <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Dolorum enim praesentium ad odit. Tempora eius architecto natus rem sed doloribus, dolorem, velit tempore sint pariatur suscipit totam. Eligendi, ullam totam!</p>
    <script>
        var nome = window.prompt('Qual é seu nome?') // O nome digitado será guardado na variável.
        window.alert('Bem-vindo à esta página, ' + nome + '!')
        /*
            Variáveis:
            Espaços para armazenar dados, são criados com var, let ou const.

            Regras sobre nomes de variáveis:
            - Podem começar com letras, $ ou _ mas não podem começar com números.
            - Letras, números, acentos e símbolos podem ser usados, não podem conter espaços.
            - Não podem ser palavras reservadas no JavaScript. EX: var var, var function e etc.

            Tipos primitivos de variáveis:
            - String: cadeia de caracteres entre '', "" ou ``.
            - Number: números.
                - Float: números decimais.
                - Int: números inteiros.
            - Boolean: valores true ou false.
            
            typeof: comando do JavaScript para saber o tipo da variável.

            +: Serve para concatenar (quando se trata de strings).
        */
    </script>
</body>
</html>
