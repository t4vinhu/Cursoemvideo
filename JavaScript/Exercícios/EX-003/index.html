<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
    <style>
        body{
            background-color: rgb(85, 249, 194);
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.568);
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1em;
        }
        
    </style>
</head>
<body>
    <h1>Olá, mundo!</h1>
    <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Dolorum enim praesentium ad odit. Tempora eius architecto natus rem sed doloribus, dolorem, velit tempore sint pariatur suscipit totam. Eligendi, ullam totam!</p>
    <script>
        var n1 = Number(window.prompt('Digite um número:')) 
        // Number(n) converte a variável para o tipo number
        // n.toString() ou String(n) converte para string
        var n2 = Number(window.prompt('Digite outro número:'))
        var s = n1 + n2
        window.alert(`A soma dos termos ${n1} e ${n2} é ${s}.`)
        // number + number = soma
        // string + string = concatenação
    </script>
</body>
</html>
