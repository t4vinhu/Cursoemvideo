<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
    <style>
        body{
            background-color: rgb(85, 249, 194);
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.568);
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1em;
        }
        
    </style>
</head>
<body>
    <h1>Olá, mundo!</h1>
    <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Dolorum enim praesentium ad odit. Tempora eius architecto natus rem sed doloribus, dolorem, velit tempore sint pariatur suscipit totam. Eligendi, ullam totam!</p>
    <script>
        var n1 = Number(window.prompt('Digite um número:')) 
        var n2 = Number(window.prompt('Digite outro número:'))
        var s = n1 + n2
        window.alert(`A soma dos termos ${n1} e ${n2} é ${s}.`)
        /*
            Para fazer com que + faça operações de soma, é preciso com que as duas variáveis a serem somadas sejam do tipo number, para isso é preciso convertê-las:
            Number.parseFloat(n): decimais
            Number.parseInt(n): inteiros
            ou simplesmete Number(n)

            Conversão number -> string:
            String(n)
            n.toString()

            Template strings:
            Permite formatar variáveis em uma só linha
            `A frase é escrita entre crases enquanto todo ${} guarda a variável.`
        */
    </script>
</body>
</html>
