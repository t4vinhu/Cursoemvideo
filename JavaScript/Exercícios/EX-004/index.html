<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
    <style>
        body{
            font: normal 2em Arial, Helvetica, sans-serif;
            
        }
    </style>
</head>
<body>
    <script>
        var nome = window.prompt('Qual é o seu nome ?')
        document.write(`Olá ${nome}, seu nome tem ${nome.length} letras. <br>`)
        document.write(`Seu nome em maiúsculo é ${nome.toUpperCase()}. <br>`)
        document.write(`Seu nome em minúsculo é ${nome.toLowerCase()}.`)
        /*
            document.write(): escreve o resultado dentro do documento HTML ao invés de no navegador.

            Outros comandos para strings:
            s.length: mostra quantos caracteres a string tem.
            s.toUpperCase(): transforma todas as letras em maiúsculas.
            s.toLowerCase(): transforma todas as letras em minúsculas.

            Outros comandos para numbers:
            n.toFixed(CD): configura as casas decimais de um número real.
            n.toLocaleString('pt-BR', {style: 'currency', currency: }): dá determinados símbolos monetários.
        */
    </script>
</body>
</html>
